:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,

h3,
h4,

b,

}

}

.table :is(caption, thead th) {

}

  corner-shape: superellipse(1.5);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

}

.tooltip {

  left: 0;

  background: var(--accent);

.text-muted {

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);

  gap: 8px;
}

.viz-controls &gt; .form-label {

  gap: 2px 12px;

.btn,

.btn {

  min-height: 28px;

a.btn {

.btn:not(:disabled):hover {

  background: var(--foreground);

.form-select:focus-visible {

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;/style&gt;
  &lt;header class=&quot;top&quot;&gt;
    &lt;div&gt;&lt;h1&gt;AI-SDLC Plugin Research &amp; Product Atlas&lt;/h1&gt;&lt;p class=&quot;subtitle&quot;&gt;Aim: reduce the avoidable cognitive, token and coordination cost of AI-assisted development by making context, intent, policy, evidence and continuation explicit—without trying to replace model gateways, project systems or mature specialist tools.&lt;/p&gt;&lt;/div&gt;
    &lt;label&gt;Content depth&lt;select id=&quot;verbosity&quot; aria-label=&quot;Content depth&quot;&gt;&lt;option value=&quot;brief&quot;&gt;Brief — abstract only&lt;/option&gt;&lt;option value=&quot;medium&quot; selected&gt;Paper — structured&lt;/option&gt;&lt;option value=&quot;full&quot;&gt;Paper — expanded&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;/header&gt;
  &lt;nav class=&quot;h-tabs&quot; aria-label=&quot;Perspective&quot;&gt;
    &lt;button data-view=&quot;idea&quot; aria-selected=&quot;true&quot;&gt;Idea&lt;/button&gt;&lt;button data-view=&quot;journey&quot; aria-selected=&quot;false&quot;&gt;Developer journey&lt;/button&gt;&lt;button data-view=&quot;agile&quot; aria-selected=&quot;false&quot;&gt;Team &amp; agile&lt;/button&gt;&lt;button data-view=&quot;economy&quot; aria-selected=&quot;false&quot;&gt;Token economy&lt;/button&gt;&lt;button data-view=&quot;governance&quot; aria-selected=&quot;false&quot;&gt;Governance&lt;/button&gt;&lt;button data-view=&quot;integration&quot; aria-selected=&quot;false&quot;&gt;Integration&lt;/button&gt;&lt;button data-view=&quot;evidence&quot; aria-selected=&quot;false&quot;&gt;Origins&lt;/button&gt;
  &lt;/nav&gt;
  &lt;div class=&quot;shell&quot;&gt;
    &lt;nav class=&quot;v-tabs&quot; aria-label=&quot;Chronological capability index&quot; id=&quot;phase-tabs&quot;&gt;&lt;/nav&gt;
    &lt;main id=&quot;content&quot; tabindex=&quot;-1&quot; aria-live=&quot;polite&quot;&gt;&lt;/main&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;sdlc-atlas&#x27;), tabs=document.getElementById(&#x27;phase-tabs&#x27;), content=document.getElementById(&#x27;content&#x27;);
    const phases=[
      {group:&#x27;Program — why this exists&#x27;,id:&#x27;charter&#x27;,n:&#x27;00&#x27;,title:&#x27;Program Aim &amp; Company Case&#x27;,era:&#x27;Thesis&#x27;,abstract:&#x27;Build a developer-side control plane for AI-assisted software work: prepare better-bounded tasks, assemble evidence, estimate execution risk, govern reusable guidance, preserve continuity and learn from verified outcomes.&#x27;,idea:[&#x27;Reduce developer fatigue and review ambiguity rather than promise autonomous perfection&#x27;,&#x27;Lower avoidable token and repair-loop cost while preserving engineering judgment&#x27;,&#x27;Give AI CoE teams a practical policy surface that developers can actually use inside their workflow&#x27;,&#x27;Interoperate with the company gateway and AI-PMS through contracts, events and identifiers—not duplicate them&#x27;],journey:&#x27;Frame work → assemble evidence → preflight risk → execute through existing systems → verify → retain reusable learning&#x27;,economy:&#x27;The economic target is total completion cost: model usage, failed exploration, rework, review time, defects and context rebuilding.&#x27;,governance:&#x27;The program is intentionally modest: it makes decisions inspectable and repeatable; it does not claim to make probabilistic agents deterministic.&#x27;,integration:&#x27;Gateway remains the provider/model control plane. AI-PMS remains the organizational work system. The plugin remains the developer-facing composition, preflight, guidance and continuity layer.&#x27;,evidence:&#x27;The direction emerged from repeated practical concerns: project-style drift, duplicated exploration, lost session state, escalating token trajectories and UI fatigue.&#x27;,deep:&#x27;Practical starting point: Prompt Contract Compiler + local token/context accounting + Session Ledger. Drift learning, semantic retrieval and predictive trajectory models should follow only after telemetry and review data exist.&#x27;,rq:&#x27;Can a local-first developer control plane reduce rework and reviewer burden without adding more process friction than it removes?&#x27;,method:&#x27;Ship a narrow IDE pilot, instrument comparable task cohorts, and measure completion trajectory, review effort, policy compliance and developer-reported fatigue.&#x27;,limits:&#x27;Benefits depend on adoption, trustworthy repository signals and careful policy ownership. A poorly tuned control plane can become bureaucracy, noisy context or another dashboard.&#x27;},
      {group:&#x27;Past — control the prompt&#x27;,id:&#x27;compiler&#x27;,n:&#x27;01&#x27;,title:&#x27;Prompt Contract Compiler&#x27;,era:&#x27;Origin&#x27;,abstract:&#x27;Turn a rough request into an explicit, reviewable task contract instead of merely polishing prose.&#x27;,idea:[&#x27;Task-type profiles for architecture, bug fix, refactor, migration, tests, docs and security&#x27;,&#x27;Structured precision fields: goal, scope, evidence, constraints, acceptance criteria and output contract&#x27;,&#x27;Deterministic local compilation; model enhancement remains optional and candidate-only&#x27;],journey:&#x27;Write → add only useful precision → compile locally → inspect plain/diff output → copy, save or export&#x27;,economy:&#x27;Spends a modest number of deliberate input tokens to prevent much larger exploration and repair loops.&#x27;,governance:&#x27;CoE owns approved base patterns; teams layer project rules without editing the base.&#x27;,integration:&#x27;Consumes context and policy through stable interfaces; sends a completed contract to the gateway or PMS execution record.&#x27;,evidence:&#x27;14–18 May: selection-based Prompt Optimizer evolved into a VS Code webview with provider state, preview and apply boundaries.&#x27;,deep:&#x27;Core artifact: versioned Prompt Contract containing task mode, explicit context references, output schema, budget policy and provenance.&#x27;},
      {group:&#x27;Past — control the prompt&#x27;,id:&#x27;context&#x27;,n:&#x27;02&#x27;,title:&#x27;Context Pack Compiler&#x27;,era:&#x27;Expansion&#x27;,abstract:&#x27;Retrieve the smallest defensible evidence bundle using semantic, lexical, structural and historical signals.&#x27;,idea:[&#x27;Hybrid retrieval: vector discovery + exact rg verification + AST/dependency relationships&#x27;,&#x27;Budgeted, deduplicated snippets with file/range citations and relevance reasons&#x27;,&#x27;Ledger retrieval for ADRs, handoffs, prior failures and accepted invariants&#x27;],journey:&#x27;Describe task → discover candidates → verify exact references → preview ranked pack → attach explicitly&#x27;,economy:&#x27;Reduces blind repository exploration while avoiding noisy vector-only retrieval.&#x27;,governance:&#x27;Exclusions for secrets, generated files, large snapshots and out-of-scope folders are policy-controlled.&#x27;,integration:&#x27;May expose narrow retrieval tools through MCP; gateway receives only the reviewed pack, PMS receives its provenance.&#x27;,evidence:&#x27;Late June: token-trajectory discussion reframed “vector search MCP” as a multi-mode Context Retrieval Gateway.&#x27;,deep:&#x27;Primary contract: compileContextPack(task, mode, repoScope, tokenCeiling) → cited snippets, confidence, gaps and suggested exact checks.&#x27;},
      {group:&#x27;Past — control cost&#x27;,id:&#x27;preflight&#x27;,n:&#x27;03&#x27;,title:&#x27;Trajectory &amp; Token Preflight&#x27;,era:&#x27;Cost turn&#x27;,abstract:&#x27;Estimate the full agent journey—not just prompt length—before expensive execution begins.&#x27;,idea:[&#x27;Deterministic tokenizer counts for prompt, guidance, tool schemas and attachments&#x27;,&#x27;Trajectory classes estimate file reads, tool calls, output size, failures and repair cycles&#x27;,&#x27;Confidence bands and interventions instead of false exact billing predictions&#x27;],journey:&#x27;See expected range and drivers → split scope or add evidence → compare revised trajectory → dispatch knowingly&#x27;,economy:&#x27;Models total task cost as prompt + exploration + generation + repair + human review, with reasoning/compute treated separately.&#x27;,governance:&#x27;Budget ceilings may warn, require justification or block dispatch according to team policy.&#x27;,integration:&#x27;Reads current provider/model price metadata from the gateway but owns behavioral estimation and recommendations.&#x27;,evidence:&#x27;29 June onward: the insight that a 2k-token prompt can cause a 150k-token session became a local Token Risk Estimator concept.&#x27;,deep:&#x27;Calibration uses completed-run telemetry as probabilistic evidence, never as a claim that one prompt is globally more efficient.&#x27;},
      {group:&#x27;Middle — learn locally&#x27;,id:&#x27;drift&#x27;,n:&#x27;04&#x27;,title:&#x27;Project Drift Memory&#x27;,era:&#x27;Learning turn&#x27;,abstract:&#x27;Remember repeated, project-specific agent mistakes and retrieve only corrections relevant to the current task.&#x27;,idea:[&#x27;Structured drift classes: scope, convention, architecture, safety, output and verification&#x27;,&#x27;Trigger, correction, confidence, modes, evidence, owner and expiry—not free-form memory&#x27;,&#x27;Human/evaluator confirmation before a learned correction becomes active&#x27;],journey:&#x27;Review a run → classify a concrete deviation → approve correction → see it suggested on similar future work&#x27;,economy:&#x27;Prevents recurrence without dumping the entire history into every prompt.&#x27;,governance:&#x27;Corrections are inspectable, revocable, scoped and time-bounded; low-confidence records remain advisory.&#x27;,integration:&#x27;Gateway supplies run usage; PMS supplies task/review references; plugin owns the reusable correction record.&#x27;,evidence:&#x27;Early July: static “better prompts” gave way to relevance-adaptive policy driven by local drift feedback.&#x27;,deep:&#x27;A correction is applied only when task mode, target scope and trigger match; contradictory corrections force review rather than silent composition.&#x27;},
      {group:&#x27;Middle — govern guidance&#x27;,id:&#x27;guidance&#x27;,n:&#x27;05&#x27;,title:&#x27;Guidance Artifact Workbench&#x27;,era:&#x27;Governance turn&#x27;,abstract:&#x27;Create, validate, adapt and safely publish the instruction artifacts that coding agents actually consume.&#x27;,idea:[&#x27;Catalog SKILL.md, AGENTS.md, custom agents, instructions and prompt files&#x27;,&#x27;Validate locally; Optimize, Enhance and Adapt through an explicitly selected model&#x27;,&#x27;Candidate-first diff, source-hash check and separate reviewed Apply/Create action&#x27;],journey:&#x27;Choose document → validate or transform → inspect diagnostics/diff → apply only after explicit review&#x27;,economy:&#x27;Local structural checks are free of model calls; model work is requested only where judgment adds value.&#x27;,governance:&#x27;Scopes, applyTo patterns, ownership, conflicts, staleness and write permissions are visible before publication.&#x27;,integration:&#x27;Publishes provider-neutral artifacts usable by Codex and other agents; records publication events in PMS if desired.&#x27;,evidence:&#x27;July: “AI Guidance” consolidated Skills, Guidance Documents and Scoped Instructions behind local-first composition.&#x27;,deep:&#x27;Provider output never writes files. Extension host owns filesystem, secrets, canonical paths, symlink safety, persistence and audit events.&#x27;},
      {group:&#x27;Middle — orchestrate work&#x27;,id:&#x27;goal&#x27;,n:&#x27;06&#x27;,title:&#x27;Goal &amp; Phase Composer&#x27;,era:&#x27;Execution turn&#x27;,abstract:&#x27;Convert a large objective into bounded phases with evidence, pause points and resumable handoffs.&#x27;,idea:[&#x27;Goal-type profiles with phase defaults, policy defaults and mapped skills&#x27;,&#x27;Explicit dependencies, acceptance gates, budgets, stop conditions and resume positions&#x27;,&#x27;Deterministic controller decides acceptance; agents plan, implement, diagnose and review&#x27;],journey:&#x27;Define outcome → generate phase graph → review gates/budgets → run → resume from durable checkpoint&#x27;,economy:&#x27;Limits runaway autonomy with per-phase context, concurrency, retries, model-call and total-token ceilings.&#x27;,governance:&#x27;Separation of producer, worker and reviewer roles; no agent self-accepts its work.&#x27;,integration:&#x27;PMS can own canonical work items and approvals; plugin composes/exposes execution contracts rather than duplicating project management.&#x27;,evidence:&#x27;Late June/July: Goal Composer and an overnight producer–orchestrator introduced durable state, checkpoints and reviewer gates.&#x27;,deep:&#x27;The plugin remains the authoring/preflight surface. A separate runtime may execute contracts, but must return evidence and terminal state.&#x27;},
      {group:&#x27;Present — preserve continuity&#x27;,id:&#x27;ledger&#x27;,n:&#x27;07&#x27;,title:&#x27;Session Ledger &amp; Recents&#x27;,era:&#x27;Continuity turn&#x27;,abstract:&#x27;Make prior work reopenable, attributable and resumable without reconstructing state from chat prose.&#x27;,idea:[&#x27;Versioned session snapshots for drafts, context, guidance, compiled output and review decisions&#x27;,&#x27;Recents entry point with continuation, not merely a log viewer&#x27;,&#x27;Import/export and handoff packages with integrity and compatibility metadata&#x27;],journey:&#x27;Open Recents → inspect last trusted state → continue or fork → preserve a new checkpoint&#x27;,economy:&#x27;Avoids repeated discovery, re-uploading and re-explaining after interruption.&#x27;,governance:&#x27;Trust states distinguish captured, imported, stale, verified and superseded evidence.&#x27;,integration:&#x27;Links sessions to gateway request IDs and PMS work-item IDs without storing either system’s business logic.&#x27;,evidence:&#x27;The UI direction explicitly added Recents and preserved Session Ledger, copy/import, trust state and provider boundaries.&#x27;,deep:&#x27;Resume must never duplicate accepted work; stale derived output is invalidated when source, rules or attached evidence changes.&#x27;},
      {group:&#x27;Present — protect developers&#x27;,id:&#x27;focus&#x27;,n:&#x27;08&#x27;,title:&#x27;Developer Focus &amp; Fatigue Shield&#x27;,era:&#x27;Human turn&#x27;,abstract:&#x27;Reduce cognitive load by showing the next decision and its immediate context, not an illuminated wall of information.&#x27;,idea:[&#x27;Compact widget-like surfaces with one primary action and progressive disclosure&#x27;,&#x27;Contextual replacement instead of long pages, nested accordions or attention-by-highlighting&#x27;,&#x27;Keyboard-first operation, visible focus, screen-reader semantics and non-color status cues&#x27;],journey:&#x27;The interface reveals only the current decision, preserves nearby context and keeps recovery actions close.&#x27;,economy:&#x27;Less UI hunting and fewer accidental dispatches translate into less human review time and fewer wasted model calls.&#x27;,governance:&#x27;Accessibility and fatigue constraints are release gates, not polish tasks.&#x27;,integration:&#x27;Works as a VS Code-native shell today; the interaction model can later travel to other IDEs or a thin web client.&#x27;,evidence:&#x27;July UI redirection: compact VS Code widgets, height conservation, no information dumps, preserved keyboard focus and task-specific views.&#x27;,deep:&#x27;Minimum checks: 360×800 usability, logical tab order, reduced motion, scalable text, error recovery, no focus traps, and no nested scrolling for core flows.&#x27;},
      {group:&#x27;Future — close the loop&#x27;,id:&#x27;evaluation&#x27;,n:&#x27;09&#x27;,title:&#x27;Evidence &amp; Evaluation Loop&#x27;,era:&#x27;Future AI-SDLC&#x27;,abstract:&#x27;Turn executions into comparable evidence that improves policy without mistaking correlation for truth.&#x27;,idea:[&#x27;Capture plan, context, changes, tests, review findings, usage, latency and outcome&#x27;,&#x27;Task-mode evals compare compliance, defect escape, repair loops and reviewer burden&#x27;,&#x27;Promote patterns or drift corrections only through evidence and explicit ownership&#x27;],journey:&#x27;Run → collect evidence → review outcome → propose a policy delta → approve, reject or expire it&#x27;,economy:&#x27;Optimizes end-to-end completion cost and reviewer burden rather than lowest prompt-token count.&#x27;,governance:&#x27;Audit trail explains who changed a policy, why, from which runs and with what confidence.&#x27;,integration:&#x27;Gateway is telemetry source; PMS is workflow source; plugin is the policy/evaluation authoring and inspection layer.&#x27;,evidence:&#x27;This is the natural synthesis of drift memory, token preflight, governed prompt patterns and independent review gates.&#x27;,deep:&#x27;Guard against Goodhart’s law: no single score. Preserve multi-dimensional evidence and allow qualitative reviewer notes.&#x27;},
      {group:&#x27;Research — keep claims honest&#x27;,id:&#x27;research&#x27;,n:&#x27;10&#x27;,title:&#x27;Research Questions &amp; Adjacent Ideas&#x27;,era:&#x27;Evidence ledger&#x27;,abstract:&#x27;Preserve the theoretical and empirical ideas discussed around the product, while clearly separating research questions, established foundations, implementation experiments and unverified hypotheses.&#x27;,idea:[&#x27;Hallucination question: truth-sensitivity at the source versus behavioral suppression at the output&#x27;,&#x27;Fixed-point and abstract-interpretation foundations for safe iterative refinement and admissibility&#x27;,&#x27;Operator-labeled graphs and telemetry signatures for representing agent/tool trajectories&#x27;,&#x27;Minimum Description Length as a way to balance fit, context cost and model complexity&#x27;,&#x27;Calibration datasets, KV-cache sensitivity and quantization as adjacent local-model experiments—not core plugin features&#x27;,&#x27;MCP tool-description quality and retrieval design as possible determinants of success, step count and context cost&#x27;],journey:&#x27;State hypothesis → identify evidence class → define falsifiable measure → run bounded experiment → record negative and positive results&#x27;,economy:&#x27;Research prevents attractive but unsupported savings claims from becoming roadmap commitments.&#x27;,governance:&#x27;Every claim is labeled as observed history, design inference, established theory, external empirical result or open hypothesis.&#x27;,integration:&#x27;Research outputs may improve the plugin estimator or policy compiler; model-serving and quantization work stays with the gateway/model platform.&#x27;,evidence:&#x27;Account discussions included hallucination suppression versus truthfulness, fixed points, Knaster–Tarski and Kleene constructions, Galois connections, Cousot–Cousot abstract interpretation, Zorn/Banach alternatives, MDL, graph telemetry, calibration-set design and OptiQ/KV-cache experiments.&#x27;,deep:&#x27;These discussions do not yet constitute a validated paper or company result. The atlas preserves them as a research agenda and demands bibliographic verification before external publication.&#x27;,rq:&#x27;Which parts of reliability improvement come from better evidence and constraints, and which merely reduce visible risk through cautious behavior?&#x27;,method:&#x27;Use controlled ablations: base prompt; structured contract; contract plus context pack; plus project corrections. Evaluate factuality, scope compliance, repair loops, novelty, abstention and reviewer burden.&#x27;,limits:&#x27;The psychiatry analogy is a provocative framing, not a mechanistic equivalence. Mathematical analogies become engineering justification only after assumptions and mappings are explicit.&#x27;},
      {group:&#x27;Future — distribute capability&#x27;,id:&#x27;market&#x27;,n:&#x27;11&#x27;,title:&#x27;Capability Packs &amp; Compatibility&#x27;,era:&#x27;Future ecosystem&#x27;,abstract:&#x27;Package proven task patterns, guidance, evals and UI metadata as portable, versioned capabilities.&#x27;,idea:[&#x27;A pack can contain task profiles, schemas, skills, scoped instructions, evals and migrations&#x27;,&#x27;Compatibility declaration for agent surface, model family, repository type and policy version&#x27;,&#x27;Local validation and preview before activation; no silent global install&#x27;],journey:&#x27;Discover pack → inspect contents/permissions → validate locally → activate for a scope → measure outcomes&#x27;,economy:&#x27;Reuses proven context structures while keeping automatic attachment budgets explicit.&#x27;,governance:&#x27;Signed provenance, least-privilege scopes, conflict analysis, revocation and upgrade notes.&#x27;,integration:&#x27;Complements a gateway’s model/provider catalog and a PMS’s templates without becoming either.&#x27;,evidence:&#x27;Emerges from the plugin’s move from a prompt library toward governed, multi-format guidance and reusable task types.&#x27;,deep:&#x27;Pack portability must not imply universal quality: activation is always project-scoped and evidence after activation can recommend rollback.&#x27;,rq:&#x27;Can reusable AI-SDLC capability bundles transfer across projects without smuggling in irrelevant assumptions?&#x27;,method:&#x27;Pilot packs in multiple repositories, measure conflicts, overrides, attachment cost and outcome deltas, and require rollback support.&#x27;,limits:&#x27;This is a later-stage ecosystem idea. Existing open-source pattern systems and native agent guidance formats may already satisfy many teams.&#x27;}

    function perspective(p){
      if(view===&#x27;idea&#x27;)return `&lt;h3&gt;Capability contribution&lt;/h3&gt;&lt;ul&gt;${p.idea.map(esc).map(x=&gt;`&lt;li&gt;${x}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;${linkButtons(p)}`;
      if(view===&#x27;journey&#x27;)return `&lt;h3&gt;Developer workflow&lt;/h3&gt;&lt;div class=&quot;flow&quot;&gt;${p.journey.split(&#x27;→&#x27;).map((x,i)=&gt;`${i?&#x27;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;b&gt;${esc(x.trim())}&lt;/b&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p data-v=&quot;medium&quot;&gt;The interaction contract uses progressive disclosure, preview-before-action, resumable state, keyboard operation and recoverable errors to reduce cognitive load.&lt;/p&gt;`;
      if(view===&#x27;agile&#x27;)return `&lt;h3&gt;Team-level agile implementation&lt;/h3&gt;&lt;p&gt;Introduce this capability through an existing delivery loop, not a parallel AI ceremony.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Backlog refinement:&lt;/b&gt; use the contract and context pack to expose scope, dependencies and unknowns.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Definition of Ready:&lt;/b&gt; require only the evidence, constraints, owner and budget needed for the task’s risk.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Sprint execution:&lt;/b&gt; retain checkpoints and evidence in the Session Ledger; gateway and PMS remain systems of record.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Code review / Definition of Done:&lt;/b&gt; attach verification evidence, policy deviations and material AI assistance.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Retrospective:&lt;/b&gt; convert repeated, verified drift into a scoped correction; expire rules that no longer help.&lt;/li&gt;&lt;/ul&gt;`;
      if(view===&#x27;economy&#x27;)return `&lt;h3&gt;Economic mechanism&lt;/h3&gt;&lt;p&gt;${esc(p.economy)}&lt;/p&gt;&lt;p data-v=&quot;medium&quot;&gt;Measure total completion trajectory: prompt, context, exploration, generation, repair, review time and escaped-defect risk. Do not optimize prompt tokens alone.&lt;/p&gt;`;
      if(view===&#x27;governance&#x27;)return `&lt;h3&gt;Governance mechanism&lt;/h3&gt;&lt;p&gt;${esc(p.governance)}&lt;/p&gt;&lt;p data-v=&quot;medium&quot;&gt;Local deterministic work first; explicit provider action second; reviewed candidate third; mutation or dispatch last. Every durable policy has scope, provenance, owner, version and retirement path.&lt;/p&gt;`;
      if(view===&#x27;integration&#x27;)return `&lt;h3&gt;System boundary&lt;/h3&gt;&lt;p&gt;${esc(p.integration)}&lt;/p&gt;&lt;div class=&quot;table-responsive&quot; data-v=&quot;medium&quot;&gt;&lt;table class=&quot;matrix&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;System&lt;/th&gt;&lt;th&gt;Primary responsibility&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Plugin&lt;/td&gt;&lt;td&gt;Developer composition, context, preflight, guidance and continuity&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Gateway&lt;/td&gt;&lt;td&gt;Authentication, model/provider routing, quotas and usage facts&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;AI-PMS&lt;/td&gt;&lt;td&gt;Work items, assignments, approvals, schedules and reporting&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
      return `&lt;h3&gt;Historical and evidentiary basis&lt;/h3&gt;&lt;p&gt;${esc(p.evidence)}&lt;/p&gt;&lt;p data-v=&quot;medium&quot;&gt;&lt;span class=&quot;status&quot;&gt;Synthesized&lt;/span&gt; This is a reconstruction from account discussions. It is not presented as measured company impact unless a controlled result exists.&lt;/p&gt;`;
    }
    function paper(p){const rq=p.rq||`Can ${p.title.toLowerCase()} improve task completion quality and developer experience enough to justify its workflow cost?`;const method=p.method||&#x27;Implement the smallest usable slice, compare matched task cohorts with and without the capability, and inspect usage, rework, review burden, policy compliance and developer feedback.&#x27;;const limits=p.limits||&#x27;The design is plausible but not yet a proven company-wide result. Effects will vary by repository quality, task type, model, team practice and adoption friction.&#x27;;return `
      &lt;section class=&quot;card&quot;&gt;&lt;h3&gt;Abstract&lt;/h3&gt;&lt;p&gt;${esc(p.abstract)}&lt;/p&gt;&lt;/section&gt;
      &lt;div data-v=&quot;medium&quot;&gt;
        &lt;section&gt;&lt;h3&gt;Keywords&lt;/h3&gt;&lt;p&gt;AI-SDLC · developer experience · context engineering · agent governance · token trajectory · agile delivery · human-in-the-loop&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;1. Background and problem&lt;/h3&gt;&lt;p&gt;AI coding can accelerate local implementation while also multiplying architectural drift, context rebuilding, inconsistent prompting, reviewer uncertainty and repair loops. The proposed capability addresses one bounded part of that wider problem.&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;2. Research question&lt;/h3&gt;&lt;p&gt;${esc(rq)}&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;3. Proposed method and system design&lt;/h3&gt;${architecture(p)}${perspective(p)}&lt;p&gt;&lt;b&gt;Executable first slice:&lt;/b&gt; choose one repository and one recurring task type; define the smallest versioned artifact this capability produces; expose preview and cancel; record input references and output hashes; require one observable verification result; export a gateway request ID and PMS work-item ID when available.&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;4. Practical company benefits&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Less time spent rediscovering context and reconstructing interrupted work—test by timing comparable task restarts.&lt;/li&gt;&lt;li&gt;More reviewable AI-assisted changes—test by recording clarification rounds, review comments and reopened defects.&lt;/li&gt;&lt;li&gt;Better cost visibility—report prompt, context, tool, repair and review components instead of one token total.&lt;/li&gt;&lt;li&gt;A usable bridge between CoE policy, developer workflows, gateway controls and PMS records—prove it with linked IDs and no duplicated business state.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;5. Team implementation in an agile workflow&lt;/h3&gt;&lt;table class=&quot;matrix&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Agile moment&lt;/th&gt;&lt;th&gt;Action and retained evidence&lt;/th&gt;&lt;th&gt;Owner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Refinement&lt;/td&gt;&lt;td&gt;Compile one task contract; mark unknowns; cite candidate files and acceptance examples&lt;/td&gt;&lt;td&gt;Developer + product/lead&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ready&lt;/td&gt;&lt;td&gt;Accept, split or defer based on scope, evidence gaps and a risk band—not a mandatory long form&lt;/td&gt;&lt;td&gt;Team&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Execution&lt;/td&gt;&lt;td&gt;Create checkpoints after accepted phases; retain tool/results summary and exact changed-file set&lt;/td&gt;&lt;td&gt;Developer&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Review / Done&lt;/td&gt;&lt;td&gt;Attach tests, unresolved warnings, policy deviations and evidence that acceptance criteria ran&lt;/td&gt;&lt;td&gt;Reviewer&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retro&lt;/td&gt;&lt;td&gt;Promote a correction only after recurrence; assign owner and expiry; remove rules that add noise&lt;/td&gt;&lt;td&gt;Team + CoE&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;b&gt;Adoption sequence:&lt;/b&gt; weeks 1–2 observe baseline; weeks 3–4 pilot with volunteers; weeks 5–6 compare outcomes and remove friction; only then consider a team default. Stop the pilot if median preparation time rises without a compensating fall in rework or review burden.&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;6. Relationship to industry direction&lt;/h3&gt;&lt;p&gt;The work aligns with IDE-native agents, MCP-style tool interoperability, skills/instruction artifacts, evals and observability, local/private models, agent orchestration and policy-as-code. It should reuse those trends where mature implementations exist, and differentiate only through developer-side composition, preflight, continuity and project-specific learning.&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;7. Expected evidence and evaluation&lt;/h3&gt;&lt;p&gt;${esc(method)}&lt;/p&gt;&lt;table class=&quot;matrix&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;Operational definition&lt;/th&gt;&lt;th&gt;Decision use&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Trajectory&lt;/td&gt;&lt;td&gt;Calls, tool steps, context read, repair cycles and elapsed active time&lt;/td&gt;&lt;td&gt;Locate avoidable waste&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Review burden&lt;/td&gt;&lt;td&gt;Clarifications, requested changes and reviewer minutes&lt;/td&gt;&lt;td&gt;Test whether structure helps humans&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Quality&lt;/td&gt;&lt;td&gt;Acceptance checks, regressions, reopened work and scope deviations&lt;/td&gt;&lt;td&gt;Prevent cheap-but-wrong optimization&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fatigue&lt;/td&gt;&lt;td&gt;Short post-task effort score plus interrupted/resumed success&lt;/td&gt;&lt;td&gt;Remove workflow friction&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;8. Discussion and practical feasibility&lt;/h3&gt;&lt;p&gt;${esc(p.deep||p.abstract)}&lt;/p&gt;&lt;p&gt;&lt;b&gt;Build now:&lt;/b&gt; local compiler, explicit context, exact token counts, versioned exports and resumable sessions. &lt;b&gt;Prototype next:&lt;/b&gt; drift memory and trajectory bands after at least a useful baseline of reviewed runs. &lt;b&gt;Research later:&lt;/b&gt; automatic policy learning and portable capability markets.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Release gate:&lt;/b&gt; the feature must work offline where its function is deterministic, expose outbound data before a model call, preserve a reversible candidate, pass keyboard and narrow-sidebar checks, and produce evidence readable without the plugin.&lt;/p&gt;&lt;/section&gt;
      &lt;/div&gt;
      &lt;div data-v=&quot;full&quot;&gt;
        &lt;section&gt;&lt;h3&gt;9. Limitations and failure modes&lt;/h3&gt;&lt;p&gt;${esc(limits)}&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Extra structure can become bureaucracy or merely move fatigue into forms.&lt;/li&gt;&lt;li&gt;Noisy retrieval and over-attached guidance can increase tokens and reduce model attention.&lt;/li&gt;&lt;li&gt;Telemetry can encourage misleading optimization if quality and human burden are omitted.&lt;/li&gt;&lt;li&gt;Learned corrections can fossilize old architecture unless ownership and expiry are enforced.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;10. Humble comparison with other tools&lt;/h3&gt;&lt;p&gt;Use existing prompt-pattern systems, notebooks, native IDE agents, repository search, gateway controls, observability platforms and project-management products when they already solve the need. This program is justified only where their seams leave developers rebuilding context, policy and execution state by hand. Integration and contribution are preferred to replacement.&lt;/p&gt;&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;11. Research and theoretical grounding&lt;/h3&gt;&lt;p&gt;The account record includes fixed-point constructions, abstract interpretation, graph/operator telemetry, MDL, calibration datasets, KV-cache sensitivity and a critical hallucination question. These are preserved as foundations or adjacent experiments—not automatically as evidence that this product works.&lt;/p&gt;${grounding(p)}&lt;/section&gt;
        &lt;section&gt;&lt;h3&gt;12. Conclusion&lt;/h3&gt;&lt;p&gt;The practical thesis is modest: make AI-assisted development easier to bound, inspect, resume and improve. Adopt each capability only when measured reduction in rework, uncertainty or fatigue exceeds the cost of the added workflow.&lt;/p&gt;&lt;/section&gt;
      &lt;/div&gt;`}
    function render(){const p=phases.find(x=&gt;x.id===active);const brief=`&lt;section class=&quot;card&quot;&gt;${perspective(p)}&lt;/section&gt;`;const body=root.dataset.verbosity===&#x27;brief&#x27;?brief:paper(p);
      content.innerHTML=`&lt;div class=&quot;crumb&quot;&gt;${esc(p.group)} · ${esc(p.era)}&lt;/div&gt;&lt;h2&gt;${p.n}. ${esc(p.title)}&lt;/h2&gt;&lt;p class=&quot;abstract&quot;&gt;${esc(p.abstract)}&lt;/p&gt;${body}`;
      content.querySelectorAll(&#x27;[data-jump]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{active=b.dataset.jump;nav();render();});content.focus({preventScroll:true});
    }
    document.getElementById(&#x27;verbosity&#x27;).onchange=e=&gt;{root.dataset.verbosity=e.target.value;render()};
    root.querySelectorAll(&#x27;.h-tabs button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{view=b.dataset.view;root.querySelectorAll(&#x27;.h-tabs button&#x27;).forEach(x=&gt;x.setAttribute(&#x27;aria-selected&#x27;,x===b));render();});
    root.dataset.verbosity=&#x27;medium&#x27;;nav();render();
  })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
